<style>
:root{
  --green:#00BC5B;
  --green-dark:#00A34F;
  --deep:#14401d;
  --deep-2:#0d2c14;
  --leaf:#5cb85c;
  --ink:#1f2a24;
  --muted:#5d6b62;
  --line:#e4ebe6;
  --bg:#f4f8f5;
  --card:#ffffff;
  --radius:16px;
  --shadow:0 10px 30px rgba(16,42,26,.10);
  --shadow-lg:0 18px 50px rgba(16,42,26,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  display:flex;flex-direction:column;min-height:100vh;
  font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.55;
}
h1,h2,h3{font-family:"Varela Round",Montserrat,sans-serif;font-weight:400;letter-spacing:-.01em}
img{max-width:100%;display:block}

.site-header{
  background:#fff;border-bottom:1px solid var(--line);
  padding:0;text-align:center;
  height:92px;display:flex;align-items:center;justify-content:center;
}
.site-header img{height:100%;width:auto;margin:0 auto;object-fit:contain}

main{flex:1 0 auto;display:flex;flex-direction:column}
.shell{max-width:760px;margin:0 auto;padding:0 18px;width:100%}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(150deg,var(--leaf) 0%, #2e7d3a 45%, var(--deep) 100%);
  padding:34px 0 46px;position:relative;
}
.hero:after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:46px;
  background:var(--bg);clip-path:ellipse(75% 100% at 50% 100%);
}

.hero h1{
  color:#fff;text-align:center;font-size:clamp(27px,6.4vw,42px);
  line-height:1.18;margin:0 0 14px;
}

.video-frame{
  background:#0b1a10;border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow-lg);aspect-ratio:16/9;position:relative;
}
.video-placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 40%,#1d4a2a,#0b1a10);
  color:#dff3e5;text-align:center;padding:20px;cursor:pointer;
}
.play{
  width:74px;height:74px;border-radius:50%;
  background:var(--green);display:grid;place-items:center;
  box-shadow:0 0 0 10px rgba(0,188,91,.22);transition:transform .2s;
}
.video-placeholder:hover .play{transform:scale(1.06)}
.play svg{width:26px;height:26px;margin-left:4px;fill:#fff}
.video-placeholder p{margin:0;font-size:13px;opacity:.75;max-width:34ch}
.video-frame video,.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;object-fit:cover;background:#0b1a10}
.play-overlay{
  position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;
  background:linear-gradient(to bottom, rgba(6,20,11,.10) 0%, rgba(6,20,11,.12) 45%, rgba(6,20,11,.52) 100%);
  cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.play-overlay:hover{background:linear-gradient(to bottom, rgba(6,20,11,.04) 0%, rgba(6,20,11,.06) 45%, rgba(6,20,11,.44) 100%)}
.play-overlay:hover .play{transform:scale(1.06)}
.sound-cta{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  display:none;align-items:center;gap:9px;
  background:rgba(0,0,0,.72);color:#fff;border:0;border-radius:99px;
  padding:11px 20px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  backdrop-filter:blur(6px);z-index:3;white-space:nowrap;
}
.sound-cta.show{display:flex}
.sound-cta:hover{background:#000}
.sound-cta svg{width:17px;height:17px;fill:#fff;flex:none}

/* ---------- booking CTA ---------- */
.book-wrap{padding:6px 0 10px}
.cta-box{
  position:relative;overflow:hidden;display:block;width:100%;
  border:2px solid var(--green);background:var(--green);
  border-radius:var(--radius);padding:18px 20px;text-align:center;
  cursor:pointer;font-family:inherit;color:#fff;text-decoration:none;
  transition:background .2s,border-color .2s,transform .12s;
}
.cta-box:hover{background:var(--green-dark);border-color:var(--green-dark)}
.cta-box:active{transform:translateY(1px)}
.cta-box.is-locked{
  cursor:not-allowed;background:#dfe8e2;border-color:#dfe8e2;color:#7c8b83;
}
.cta-box.is-locked:hover{background:#dfe8e2;border-color:#dfe8e2}
.cta-box.is-locked:active{transform:none}
.cta-box.is-locked .cta-sub{color:#8b998f}
.cta-fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:linear-gradient(90deg, rgba(0,188,91,.20), rgba(0,188,91,.38));
  border-right:1px solid rgba(0,188,91,.55);
  transition:width .3s linear;pointer-events:none;z-index:0;
}
.cta-box.is-unlocked .cta-fill{opacity:0;transition:opacity .3s ease}
.cta-text{position:relative;z-index:1;display:block}
.cta-box.is-unlocked{animation:ctaPop .35s ease both}
@keyframes ctaPop{from{opacity:.55;transform:scale(.99)}to{opacity:1;transform:none}}
.cta-main{display:block;font-family:"Varela Round",sans-serif;font-size:clamp(19px,4.6vw,24px)}
.cta-sub{display:block;font-size:13.5px;margin-top:4px;font-weight:500;color:#dff3e5}

/* ---------- content ---------- */

footer{background:var(--deep-2);color:#9fc2ab;text-align:center;padding:22px 18px;font-size:12.5px;margin-top:34px}
footer a{color:#cdeed9}
</style>
</head>

<main>

  <div class="hero">
    <div class="shell">
      <h1>Before we speak, here is the whole picture</h1>

      <div class="video-frame">
        <div class="video-placeholder" id="videoPlaceholder">
          <div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <p>The video will appear here once it is uploaded.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="shell book-wrap">
    <a class="cta-box is-locked" id="bookBtn" href="#" aria-disabled="true">
      <span class="cta-fill" id="ctaFill" aria-hidden="true"></span>
      <span class="cta-text">
        <span class="cta-main">Book your 30 minute interview</span>
        <span class="cta-sub" id="ctaSub">Watch the video to unlock</span>
      </span>
    </a>
  </div>

</main>

<footer>
  Expand Accounts, Construction Accountants &middot; All applications treated in confidence<br>
  <a href="https://expandaccounts.co.uk" target="_blank" rel="noopener">expandaccounts.co.uk</a>
</footer>

<script>
const CFG = window.FUNNEL_CONFIG;

/* ---------- booking gate ----------
   The interview link stays locked until the video has been watched through.
   Pausing and rewinding are fine, skipping ahead is not, and muted playback
   does not count. The gate always FAILS OPEN: no video, a 404, or an embed we
   cannot measure all unlock the button, so the page can never dead-end. */
const ctaBtn  = document.getElementById('bookBtn');
const ctaSub  = document.getElementById('ctaSub');
const ctaFill = document.getElementById('ctaFill');
let ctaUnlocked = false;

ctaBtn.addEventListener('click', function(e){
  if (!ctaUnlocked) { e.preventDefault(); return; }
  if (!CFG.bookingUrl) e.preventDefault();
});

function unlockCta(){
  if (ctaUnlocked) return;
  ctaUnlocked = true;
  ctaBtn.href = CFG.bookingUrl;
  ctaBtn.target = '_blank';
  ctaBtn.rel = 'noopener';
  ctaBtn.removeAttribute('aria-disabled');
  ctaBtn.classList.remove('is-locked');
  ctaBtn.classList.add('is-unlocked');
  if (ctaSub)  ctaSub.textContent = 'Opens my calendar in a new tab';
  if (ctaFill) ctaFill.style.width = '100%';
}

function gateOnVideo(v){
  let maxWatched = 0, lastT = 0;
  const SLACK = 1.0;

  function paint(){
    if (ctaUnlocked) return;
    const d = v.duration;
    const pct = (isFinite(d) && d > 0) ? Math.min(100, (maxWatched / d) * 100) : 0;
    if (ctaFill) ctaFill.style.width = pct.toFixed(1) + '%';
    if (!ctaSub) return;
    if (v.muted && !v.paused && v.currentTime > 1) ctaSub.textContent = 'Turn the sound on to unlock';
    else if (pct >= 99) ctaSub.textContent = 'Almost there';
    else ctaSub.textContent = 'Watch the video to unlock';
  }

  v.addEventListener('loadedmetadata', paint);
  ['play','pause','volumechange','seeked'].forEach(function(e){ v.addEventListener(e, paint); });
  paint();

  v.addEventListener('timeupdate', function(){
    if (ctaUnlocked) return;
    const t = v.currentTime;
    if (!v.muted && t > maxWatched && t - lastT >= 0 && t - lastT < 2) maxWatched = t;
    lastT = t;
    paint();
    if (isFinite(v.duration) && v.duration > 0 && maxWatched >= v.duration - 0.75) unlockCta();
  });

  v.addEventListener('seeking', function(){
    if (ctaUnlocked) return;
    if (v.currentTime > maxWatched + SLACK) {
      v.currentTime = maxWatched;
      lastT = maxWatched;
      if (ctaSub) { ctaSub.textContent = 'No skipping ahead'; setTimeout(paint, 1400); }
    }
  });

  v.addEventListener('ended', function(){
    if (isFinite(v.duration) && maxWatched >= v.duration - 1.5) unlockCta();
    else paint();
  });
}

(function setupVideo(){
  const frame = document.querySelector('.video-frame');
  const vp = document.getElementById('videoPlaceholder');
  const url = (CFG.videoUrl || '').trim();

  if (!url) { unlockCta(); return; }

  const isFile = /\.(mp4|webm|ogg|mov)(\?|$)/i.test(url);
  const mode = CFG.videoAutoplay || 'off';
  if (vp) vp.style.display = 'none';

  if (!isFile) {
    /* An iframe embed cannot be measured, so the gate fails open. */
    const u = new URL(url, location.href);
    u.searchParams.set('playsinline', '1');
    const f = document.createElement('iframe');
    f.src = u.toString();
    f.allow = 'autoplay; fullscreen; picture-in-picture';
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('title', 'Conor Bentley on the Senior Accountant role');
    frame.appendChild(f);
    unlockCta();
    return;
  }

  const v = document.createElement('video');
  v.src = url;
  v.setAttribute('playsinline', '');
  v.playsInline = true;
  v.controls = true;
  v.preload = 'metadata';
  if (CFG.videoPoster) v.poster = CFG.videoPoster;

  v.addEventListener('error', function(){
    v.remove();
    const ov = frame.querySelector('.play-overlay'); if (ov) ov.remove();
    const sc = frame.querySelector('.sound-cta');    if (sc) sc.remove();
    if (vp) vp.style.display = '';
    unlockCta();
  });

  frame.appendChild(v);
  gateOnVideo(v);

  function addPlayOverlay(){
    if (frame.querySelector('.play-overlay')) return;
    v.controls = false;
    const over = document.createElement('button');
    over.className = 'play-overlay';
    over.setAttribute('aria-label', 'Play the video');
    over.innerHTML = '<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>';
    over.addEventListener('click', function(){
      v.muted = false;
      v.volume = 1;
      v.controls = true;
      over.remove();
      v.play().catch(function(){ v.controls = true; });
    });
    frame.appendChild(over);
  }

  function addSoundCta(){
    if (frame.querySelector('.sound-cta')) return;
    const b = document.createElement('button');
    b.className = 'sound-cta show';
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/></svg> Tap for sound';
    b.addEventListener('click', function(){
      v.muted = false;
      v.volume = 1;
      b.remove();
      v.play().catch(function(){});
    });
    frame.appendChild(b);
  }

  if (mode === 'off') { addPlayOverlay(); return; }

  v.muted = (mode === 'muted');
  v.play().then(function(){
    if (v.muted) addSoundCta();
  }).catch(function(){
    v.muted = true;
    v.play().then(addSoundCta).catch(addPlayOverlay);
  });
})();
</script>
